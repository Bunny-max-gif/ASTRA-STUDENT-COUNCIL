# Pings the database every 3 days so the free Supabase project does not pause.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
name: keepalive
on:
  schedule: [{ cron: '0 6 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/clubs?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
